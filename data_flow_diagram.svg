<svg viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <rect width="1200" height="820" fill="#17181c"/>
  <text x="30" y="40" fill="#f0f0f0" font-size="22" font-weight="bold">Data flow — Image-to-HDMI Upload System</text>

  <!-- Laptop column -->
  <rect x="30" y="70" width="430" height="300" rx="10" fill="#1f2125" stroke="#3a3d42"/>
  <text x="50" y="100" fill="#8ab4f8" font-size="16" font-weight="bold">Laptop GUI (Python / tkinter)</text>
  <text x="50" y="130" fill="#e8eaed" font-size="14">Choose image button</text>
  <text x="50" y="152" fill="#e8eaed" font-size="14">Preview pane</text>
  <text x="50" y="174" fill="#e8eaed" font-size="14">COM-port dropdown</text>
  <text x="50" y="196" fill="#e8eaed" font-size="14">Send button</text>
  <line x1="50" y1="208" x2="440" y2="208" stroke="#3a3d42"/>
  <text x="50" y="232" fill="#fbbc04" font-size="14">Pillow: resize image → 480x270</text>
  <text x="50" y="254" fill="#fbbc04" font-size="14">Convert → RGB888 bytes (388,800 B)</text>
  <text x="50" y="254" fill="#fbbc04" font-size="14" dy="22">(or RGB565, 2 B/px, for speed)</text>
  <text x="50" y="300" fill="#fbbc04" font-size="14">Build packet:</text>
  <text x="50" y="322" fill="#ffffff" font-size="14">  sync header 0xAA 0x55</text>
  <text x="50" y="344" fill="#ffffff" font-size="14">  + pixels in raster order</text>
  <text x="50" y="366" fill="#34a853" font-size="13">pyserial → write(packet)</text>

  <!-- USB-C link -->
  <rect x="490" y="150" width="220" height="110" rx="8" fill="#1f2125" stroke="#3a3d42"/>
  <text x="505" y="175" fill="#8ab4f8" font-size="14" font-weight="bold">USB-C cable</text>
  <text x="505" y="196" fill="#e8eaed" font-size="12">Same connector used</text>
  <text x="505" y="212" fill="#e8eaed" font-size="12">for FPGA programming</text>
  <text x="505" y="228" fill="#e8eaed" font-size="12">→ also exposes a COM port</text>
  <text x="505" y="244" fill="#e8eaed" font-size="12">via FT2232H UART (no extra HW)</text>
  <line x1="460" y1="205" x2="488" y2="205" stroke="#9aa0a6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="205" x2="738" y2="205" stroke="#9aa0a6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Baud table -->
  <rect x="30" y="400" width="430" height="150" rx="10" fill="#1f2125" stroke="#3a3d42"/>
  <text x="50" y="425" fill="#8ab4f8" font-size="14" font-weight="bold">Upload time (388,800 B RGB888)</text>
  <text x="50" y="452" fill="#e8eaed" font-size="13">Baud rate</text>
  <text x="250" y="452" fill="#e8eaed" font-size="13">Time</text>
  <line x1="50" y1="460" x2="440" y2="460" stroke="#3a3d42"/>
  <text x="50" y="482" fill="#ffffff" font-size="13">115200</text>
  <text x="250" y="482" fill="#ffffff" font-size="13">~34 s</text>
  <text x="50" y="504" fill="#ffffff" font-size="13">921600</text>
  <text x="250" y="504" fill="#ffffff" font-size="13">~4.3 s</text>
  <text x="50" y="526" fill="#ffffff" font-size="13">3 Mbaud</text>
  <text x="250" y="526" fill="#ffffff" font-size="13">~1.3 s</text>

  <!-- FPGA column -->
  <rect x="740" y="70" width="430" height="300" rx="10" fill="#1f2125" stroke="#3a3d42"/>
  <text x="760" y="100" fill="#8ab4f8" font-size="16" font-weight="bold">FPGA</text>
  <text x="760" y="128" fill="#e8eaed" font-size="14">uart_rx</text>
  <text x="760" y="150" fill="#e8eaed" font-size="13">detect sync 0xAA 0x55</text>
  <text x="760" y="170" fill="#e8eaed" font-size="13">→ reset write address to 0</text>
  <text x="760" y="192" fill="#e8eaed" font-size="13">assemble RGB pixels, count addresses</text>
  <line x1="950" y1="210" x2="950" y2="236" stroke="#9aa0a6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="760" y="262" fill="#34a853" font-size="14" font-weight="bold">Simple dual-port RAM</text>
  <text x="760" y="282" fill="#e8eaed" font-size="13">480x270x24-bit ≈ 3.1 Mbit</text>
  <text x="760" y="300" fill="#e8eaed" font-size="13">(fits in 6.89 Mbit M20K)</text>
  <text x="760" y="320" fill="#e8eaed" font-size="13">write clk 50 MHz | read clk 148.5 MHz</text>
  <text x="760" y="340" fill="#e8eaed" font-size="13">4x upscale addressing</text>
  <text x="760" y="360" fill="#fbbc04" font-size="12">(.mif kept as initial contents)</text>

  <line x1="950" y1="370" x2="950" y2="396" stroke="#9aa0a6" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="740" y="400" width="430" height="90" rx="10" fill="#1f2125" stroke="#3a3d42"/>
  <text x="760" y="430" fill="#e8eaed" font-size="14">invert (~RGB) → vpg → TFP410 → HDMI</text>
  <text x="760" y="455" fill="#e8eaed" font-size="13">→ monitor</text>

  <!-- bottom note -->
  <rect x="30" y="580" width="1140" height="190" rx="10" fill="#1f2125" stroke="#3a3d42"/>
  <text x="50" y="608" fill="#8ab4f8" font-size="15" font-weight="bold">Protocol / memory notes</text>
  <text x="50" y="634" fill="#e8eaed" font-size="13">• Replace existing ROM IP with a simple dual-clock RAM (separate read/write clocks); .mif stays as init contents.</text>
  <text x="50" y="656" fill="#e8eaed" font-size="13">• Sync header (0xAA 0x55) precedes every upload and resets the write address — a dropped byte can't shift the picture.</text>
  <text x="50" y="678" fill="#e8eaed" font-size="13">• Start at 115200 baud to validate the link, then raise baud rate (921600 → 3 Mbaud) for speed.</text>
  <text x="50" y="700" fill="#e8eaed" font-size="13">• For even faster uploads, send RGB565 (2 bytes/pixel) and expand to RGB888 in the FPGA.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
